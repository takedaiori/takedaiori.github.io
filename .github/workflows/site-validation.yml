name: Site export validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: site-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  scope:
    name: Classify release validation scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
      dependency_only: ${{ steps.scope.outputs.dependency_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/maintenance/validation-scope.cjs
  gate:
    name: Site validation gate
    needs: [scope, export]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation or an explicit documentation-only exemption
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          REQUIRED: ${{ needs.scope.outputs.required }}
          EXPORT_RESULT: ${{ needs.export.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$REQUIRED" = false ]; then
            test "$EXPORT_RESULT" = skipped
          else
            test "$REQUIRED" = true
            test "$EXPORT_RESULT" = success
          fi
  export:
    name: Full site export & artifact scan
    # Owner branches or same-repo Dependabot version-only updates may build.
    # Changes to scripts, dependency names or other files do not qualify as bot updates.
    needs: scope
    if: needs.scope.outputs.required == 'true' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.user.login == github.repository_owner || (github.event.pull_request.user.login == 'dependabot[bot]' && needs.scope.outputs.dependency_only == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
      NEXT_PUBLIC_THEME: insignificantia
      NEXT_PUBLIC_THEME_SWITCH: 'false'
      NEXT_PUBLIC_WIDGET_PET: 'false'
      NEXT_PUBLIC_WIDGET_PET_SWITCH_THEME: 'false'
      NEXT_PUBLIC_POSTS_PER_PAGE: '15'
      NEXT_PUBLIC_LINK: https://takedaiori.github.io
      BUILD_PREFETCH_ENABLED: 'false'
      STATIC_PAGE_GENERATION_TIMEOUT: '600'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: yarn
      - run: npm install -g yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - name: Validate published data source
        run: test -n "$NOTION_PAGE_ID"
      - name: Export and scan without publishing
        run: |
          yarn export
          yarn perf:page-data
          node scripts/maintenance/site-artifact-audit.cjs
      - name: Download published snapshot for pruning simulation
        if: ${{ hashFiles('pruning-plan.json') != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await require('./scripts/maintenance/download-pruning-baseline.cjs')({github, context})
      - name: Extract public baseline safely
        if: ${{ hashFiles('pruning-plan.json') != '' }}
        run: |
          python - <<'PYTHON'
          import pathlib, tarfile, zipfile
          with zipfile.ZipFile('.tmp/pruning-baseline.zip') as z:
              with z.open('artifact.tar') as source, open('.tmp/pruning-baseline.tar', 'wb') as dest:
                  import shutil
                  shutil.copyfileobj(source, dest)
          with tarfile.open('.tmp/pruning-baseline.tar') as t:
              for item in t.getmembers():
                  if item.issym() or item.islnk() or item.name.startswith('/') or '..' in pathlib.PurePosixPath(item.name).parts:
                      raise ValueError('Unsafe public artifact entry')
              t.extractall('.tmp/pruning-baseline', filter='data')
          PYTHON
      - name: Install CJK fonts for realistic browser screenshots
        if: ${{ hashFiles('pruning-plan.json') != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match :lang=zh-cn
      - name: Simulate resource removal and check browser behavior
        if: ${{ hashFiles('pruning-plan.json') != '' }}
        run: node scripts/maintenance/pruning-browser-smoke.cjs
      - name: Save pruning simulation evidence
        if: ${{ always() && hashFiles('pruning-plan.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pruning-simulation
          path: |
            .perf/pruning-smoke.json
            .perf/pruning-screenshots
          retention-days: 7
          if-no-files-found: warn

      - name: Verify static-host frame protection and canonical URLs
        run: node scripts/maintenance/frame-guard-smoke.cjs
      - name: Save frame protection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frame-guard-smoke
          path: .perf/frame-guard-smoke.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save validation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-site-audit
          path: .perf/site-audit-report.json
          retention-days: 7
          if-no-files-found: error

      - name: Build and scan server deployment without publishing
        run: |
          node scripts/maintenance/verify-server-env.cjs
          yarn build
          node scripts/maintenance/audit-server-output.cjs
          node scripts/maintenance/server-security-smoke.cjs
      - name: Save server validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: server-output-audit
          path: |
            .perf/server-output-audit.json
            .perf/server-security-smoke.json
          retention-days: 7
          if-no-files-found: warn
