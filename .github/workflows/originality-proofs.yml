name: Originality proofs

on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * *'

permissions:
  contents: write

jobs:
  update:
    if: github.ref == 'refs/heads/main' && vars.ORIGINALITY_PROOF_AUTO_MANIFEST == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          ORIGINALITY_PROOF_AUTO_MANIFEST: 'true'
      - name: Commit proof manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/proofs/originality.json; then
            echo "No originality proof changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/proofs/originality.json
          git commit -m "chore: update originality proofs"
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f' push
