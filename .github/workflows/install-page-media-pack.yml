name: Install page media pack
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'ZIP basename at repository root'
        required: true
        default: 'Insignificantia-page-media.zip'
        type: string
      validate_only:
        description: 'Validate only; do not prepare an image maintenance branch'
        default: true
        type: boolean
  push:
    branches: [main]
    paths: ['Insignificantia-page-media.zip']
permissions:
  contents: read
concurrency:
  group: page-media-maintenance
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      present: ${{ steps.pack.outputs.present }}
      package: ${{ steps.pack.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve package (deletion pushes are a no-op)
        id: pack
        env:
          INPUT_PACKAGE: ${{ inputs.package_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          name = os.environ['INPUT_PACKAGE'] if os.environ['EVENT_NAME'] == 'workflow_dispatch' else 'Insignificantia-page-media.zip'
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,99}\.zip', name):
              raise SystemExit('Invalid ZIP basename')
          p = pathlib.Path(name)
          if p.is_symlink():
              raise SystemExit('Symlinked ZIP rejected')
          present = p.is_file()
          if not present and os.environ['EVENT_NAME'] == 'workflow_dispatch':
              raise SystemExit('ZIP not found; upload it through a PR first')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'package={name}\npresent={str(present).lower()}\n')
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.pack.outputs.present == 'true'
        with:
          node-version: '22'
          cache: yarn
      - name: Install decoder without dependency lifecycle scripts
        if: steps.pack.outputs.present == 'true'
        run: |
          npm install -g yarn@1.22.22 --ignore-scripts
          yarn install --frozen-lockfile --ignore-scripts
      - name: Validate archive and fully decode images (no application secrets)
        if: steps.pack.outputs.present == 'true'
        env:
          PACK: ${{ steps.pack.outputs.package }}
        run: python scripts/maintenance/page-media-pack.py validate "$PACK" "$RUNNER_TEMP/validated-media.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.pack.outputs.present == 'true'
        with:
          name: validated-media-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validated-media.json
          retention-days: 1
          if-no-files-found: error
      - name: Report validation
        run: echo 'ZIP validation completed. A missing ZIP on a deletion push is intentionally skipped. Validation alone never publishes images.' >> "$GITHUB_STEP_SUMMARY"
  prepare-branch:
    needs: validate
    if: needs.validate.outputs.present == 'true' && (github.event_name == 'push' || inputs.validate_only == false)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-media-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validated-media
      - name: Verify exact ZIP and stage only allowed image slots
        env:
          PACK: ${{ needs.validate.outputs.package }}
        run: |
          python scripts/maintenance/page-media-pack.py install "$PACK" "$RUNNER_TEMP/validated-media/validated-media.json"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'validated-media/validated-media.json').read_text())
          paths = list(manifest['files'])
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'rm', '--', os.environ['PACK']], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          if set(filter(None, staged)) - set(paths + [os.environ['PACK']]):
              raise SystemExit('Unexpected staged files')
          PY
      - name: Commit isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "maintenance/page-media-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git commit -m 'Media maintenance: install validated page image pack'
      - name: Push maintenance branch (never main)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BRANCH="maintenance/page-media-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$BRANCH" =~ ^maintenance/page-media-[0-9]+-[0-9]+$ ]]
          # shellcheck disable=SC2016 # Expand the token only inside Git's credential helper.
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f' push origin "HEAD:refs/heads/$BRANCH"
          echo "### Create an image maintenance PR" >> "$GITHUB_STEP_SUMMARY"
          echo "Open https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1 or ask the assistant to create this PR. Wait for required checks, merge, then manually deploy Pages. This workflow neither merges nor deploys." >> "$GITHUB_STEP_SUMMARY"
