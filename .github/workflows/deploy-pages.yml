name: Deploy NotionNext to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Ignore previous build cache
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
      NEXT_PUBLIC_THEME: insignificantia
      NEXT_PUBLIC_THEME_SWITCH: "false"
      NEXT_PUBLIC_WIDGET_PET: "false"
      NEXT_PUBLIC_WIDGET_PET_SWITCH_THEME: "false"
      NEXT_PUBLIC_POSTS_PER_PAGE: "15"
      NEXT_PUBLIC_LINK: https://takedaiori.github.io
      BUILD_PREFETCH_ENABLED: "false"
      STATIC_PAGE_GENERATION_TIMEOUT: "600"
      HAS_BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn

      - name: Install Yarn 1
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate published data source
        run: |
          if [ -z "$NOTION_PAGE_ID" ]; then
            echo "Missing NOTION_PAGE_ID repository secret. Stop; do not use the upstream demo database."
            exit 1
          fi

      - name: Restore encrypted build cache
        id: build-cache
        if: ${{ !inputs.clean_build && env.HAS_BUILD_CACHE_KEY == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .build-cache/cache.enc
          key: pages-encrypted-v1-${{ runner.os }}-${{ hashFiles('yarn.lock', 'next.config.js', 'lib/cache/**', 'lib/db/**', 'scripts/maintenance/encrypted-build-cache.cjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pages-encrypted-v1-${{ runner.os }}-${{ hashFiles('yarn.lock', 'next.config.js', 'lib/cache/**', 'lib/db/**', 'scripts/maintenance/encrypted-build-cache.cjs') }}-

      - name: Decrypt recent versioned cache
        if: ${{ !inputs.clean_build && env.HAS_BUILD_CACHE_KEY == 'true' }}
        env:
          BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY }}
        run: node scripts/maintenance/encrypted-build-cache.cjs restore

      - name: Export static site
        run: |
          started=$SECONDS
          yarn export
          echo "Static export: $((SECONDS-started)) seconds" >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt successful build cache
        if: ${{ env.HAS_BUILD_CACHE_KEY == 'true' }}
        env:
          BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY }}
        run: node scripts/maintenance/encrypted-build-cache.cjs save

      - name: Save encrypted build cache
        if: ${{ env.HAS_BUILD_CACHE_KEY == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .build-cache/cache.enc
          key: pages-encrypted-v1-${{ runner.os }}-${{ hashFiles('yarn.lock', 'next.config.js', 'lib/cache/**', 'lib/db/**', 'scripts/maintenance/encrypted-build-cache.cjs') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
