name: Deploy NotionNext to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build and scan without publishing Pages
        type: boolean
        default: false
      clean_build:
        description: Ignore previous build cache
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
      NEXT_PUBLIC_THEME: insignificantia
      NEXT_PUBLIC_THEME_SWITCH: "false"
      NEXT_PUBLIC_WIDGET_PET: "false"
      NEXT_PUBLIC_WIDGET_PET_SWITCH_THEME: "false"
      NEXT_PUBLIC_POSTS_PER_PAGE: "15"
      NEXT_PUBLIC_LINK: https://takedaiori.github.io
      BUILD_PREFETCH_ENABLED: "false"
      STATIC_PAGE_GENERATION_TIMEOUT: "600"
      HAS_BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: yarn

      - name: Install Yarn 1
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate published data source
        run: |
          if [ -z "$NOTION_PAGE_ID" ]; then
            echo "Missing NOTION_PAGE_ID repository secret. Stop; do not use the upstream demo database."
            exit 1
          fi

      - name: Restore encrypted build cache
        id: build-cache
        if: ${{ !inputs.clean_build && env.HAS_BUILD_CACHE_KEY == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .build-cache/cache.enc
          key: pages-encrypted-v1-${{ runner.os }}-${{ hashFiles('yarn.lock', 'next.config.js', 'lib/cache/**', 'lib/db/**', 'scripts/maintenance/encrypted-build-cache.cjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pages-encrypted-v1-${{ runner.os }}-${{ hashFiles('yarn.lock', 'next.config.js', 'lib/cache/**', 'lib/db/**', 'scripts/maintenance/encrypted-build-cache.cjs') }}-

      - name: Decrypt recent versioned cache
        if: ${{ !inputs.clean_build && env.HAS_BUILD_CACHE_KEY == 'true' }}
        env:
          BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY }}
        run: node scripts/maintenance/encrypted-build-cache.cjs restore

      - name: Export static site
        run: |
          started=$SECONDS
          yarn export
          echo "Static export: $((SECONDS-started)) seconds" >> "$GITHUB_STEP_SUMMARY"

      - name: Check page data budget
        env:
          PERF_PAGE_DATA_WARN_KB: "128"
          PERF_LIST_DATA_FAIL_KB: "256"
        run: yarn perf:page-data

      - name: Restore previous successful size report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await require('./scripts/maintenance/restore-site-baseline.cjs')({github, context, core})

      - name: Read baseline data without extracting files
        run: |
          python - <<'PYTHON'
          import json, pathlib, zipfile
          archive = pathlib.Path('.perf/baseline.zip')
          if archive.exists():
              with zipfile.ZipFile(archive) as z:
                  info = z.getinfo('site-audit-report.json')
                  if info.file_size > 10 * 1024 * 1024:
                      raise ValueError('Baseline report is unexpectedly large')
                  data = json.loads(z.read(info))
                  if data.get('schema') != 1:
                      raise ValueError('Unsupported baseline schema')
                  pathlib.Path('.perf/baseline.json').write_text(json.dumps(data))
          PYTHON

      - name: Scan publish output and report site size changes
        env:
          SCAN_SECRET_BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY }}
        run: node scripts/maintenance/site-artifact-audit.cjs

      - name: Save size and scan report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-audit-report
          path: .perf/site-audit-report.json
          retention-days: 30
          if-no-files-found: error

      - name: Encrypt successful build cache
        if: ${{ env.HAS_BUILD_CACHE_KEY == 'true' }}
        env:
          BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY }}
        run: node scripts/maintenance/encrypted-build-cache.cjs save

      - name: Save encrypted build cache
        if: ${{ env.HAS_BUILD_CACHE_KEY == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .build-cache/cache.enc
          key: pages-encrypted-v1-${{ runner.os }}-${{ hashFiles('yarn.lock', 'next.config.js', 'lib/cache/**', 'lib/db/**', 'scripts/maintenance/encrypted-build-cache.cjs') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./out

  deploy:
    if: ${{ !inputs.validate_only }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
