name: Dispatch validated Pages deployment (temporary)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-next-update-once.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/takedaiori/takedaiori.github.io/actions/workflows/deploy-pages.yml/dispatches \
            --data '{"ref":"main"}'
