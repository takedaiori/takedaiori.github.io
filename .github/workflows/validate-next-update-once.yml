name: Validate Next security update (temporary)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-next-update-once.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "validate-next-update-once"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
      NEXT_PUBLIC_THEME: insignificantia
      NEXT_PUBLIC_THEME_SWITCH: "false"
      NEXT_PUBLIC_WIDGET_PET: "false"
      NEXT_PUBLIC_WIDGET_PET_SWITCH_THEME: "false"
      NEXT_PUBLIC_POSTS_PER_PAGE: "15"
      NEXT_PUBLIC_LINK: https://takedaiori.github.io
      BUILD_PREFETCH_ENABLED: "false"
      STATIC_PAGE_GENERATION_TIMEOUT: "600"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: 2cfe1cf23b2cc583c88753631c1c0f78fa1ba585

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Yarn 1
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate published data source
        run: |
          if [ -z "$NOTION_PAGE_ID" ]; then
            echo "Missing NOTION_PAGE_ID repository secret. Stop; do not use the upstream demo database."
            exit 1
          fi

      - name: Export static site
        run: yarn export

