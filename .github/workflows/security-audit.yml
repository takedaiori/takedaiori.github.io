name: Full security audit
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    name: Security audit gate
    needs: [audit, maintenance-static]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          AUDIT_RESULT: ${{ needs.audit.result }}
          STATIC_RESULT: ${{ needs.maintenance-static.result }}
        run: test "$AUDIT_RESULT" = success && test "$STATIC_RESULT" = success
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: node scripts/maintenance/security-surface-check.cjs
      - run: node scripts/maintenance/vendored-resource-audit.cjs
      # Deliberately does not install packages or expose deployment secrets.
      - run: node scripts/maintenance/full-dependency-audit.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-dependency-audit
          path: |
            .perf/full-dependency-audit.json
            .perf/vendored-resource-audit.json
          retention-days: 30
          if-no-files-found: warn
  maintenance-static:
    name: Maintenance code & history secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install SHA-256 pinned security tools
        run: python scripts/maintenance/install-audit-tools.py
      - name: Validate workflow semantics
        run: .tmp/audit-tools/actionlint -shellcheck=.tmp/audit-tools/shellcheck
      - name: Compile all tracked Python maintenance code
        run: python -m compileall -q scripts/maintenance pushUrl.py
      - name: Check shell maintenance syntax
        run: bash -n scripts/update.sh && .tmp/audit-tools/shellcheck scripts/update.sh
      - name: Scan complete reachable Git history without exposing matching values
        run: .tmp/audit-tools/gitleaks git --redact=100 --no-banner --log-opts=--all
      - name: Scan current files, including uncommitted PR additions
        run: .tmp/audit-tools/gitleaks dir --redact=100 --no-banner --max-target-megabytes=20
