name: Full security audit
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
  pull_request:
    branches: [main]
    paths: ['scripts/maintenance/*page*', '.github/workflows/install-page-media-pack.yml', 'vendored-resources.json', 'components/Lenis.js', 'components/FullScreenButton.js', 'lib/plugins/wow.js', 'next.config.js', 'package.json', 'yarn.lock', 'scripts/maintenance/*audit*', 'scripts/maintenance/security-surface-check.cjs', 'public/**', 'components/External*', 'components/VConsole.js', 'pages/auth/**', 'pages/api/auth/**', 'lib/security/**', '.github/workflows/security-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: node scripts/maintenance/security-surface-check.cjs
      - run: node scripts/maintenance/vendored-resource-audit.cjs
      # Deliberately does not install packages or expose deployment secrets.
      - run: node scripts/maintenance/full-dependency-audit.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-dependency-audit
          path: |
            .perf/full-dependency-audit.json
            .perf/vendored-resource-audit.json
          retention-days: 30
          if-no-files-found: warn
