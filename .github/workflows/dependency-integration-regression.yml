name: Dependency integration regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dependency-integration-regression.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
      NEXT_PUBLIC_THEME: insignificantia
      NEXT_PUBLIC_THEME_SWITCH: 'false'
      NEXT_PUBLIC_WIDGET_PET: 'false'
      NEXT_PUBLIC_WIDGET_PET_SWITCH_THEME: 'false'
      NEXT_PUBLIC_POSTS_PER_PAGE: '15'
      NEXT_PUBLIC_LINK: https://takedaiori.github.io
      BUILD_PREFETCH_ENABLED: 'false'
      STATIC_PAGE_GENERATION_TIMEOUT: '600'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install -g yarn@1.22.22
      - name: Ensure production source is unchanged
        run: |
          git diff --exit-code c5d46b6cd9ad2bdcad15875648ec69022d7f1abd HEAD -- themes components pages styles public lib next.config.js blog.config.js
          test -n "$NOTION_PAGE_ID"
      - name: Build deployed baseline
        run: |
          git worktree add "$RUNNER_TEMP/baseline" c5d46b6cd9ad2bdcad15875648ec69022d7f1abd
          cd "$RUNNER_TEMP/baseline"
          yarn install --frozen-lockfile
          yarn export > "$RUNNER_TEMP/baseline-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/baseline-build.log"; exit 1; }
      - name: Build integration candidate
        run: |
          yarn install --frozen-lockfile
          yarn deps:check-lockfile
          yarn export > "$RUNNER_TEMP/candidate-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/candidate-build.log"; exit 1; }
      - name: Install comparison browser
        run: |
          npm install --prefix "$RUNNER_TEMP/visual" playwright@1.56.1
          "$RUNNER_TEMP/visual/node_modules/.bin/playwright" install --with-deps chromium
      - name: Compare pages and styles on desktop and mobile
        run: |
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/baseline/out" > /dev/null 2>&1 &
          python3 -m http.server 4174 --directory out > /dev/null 2>&1 &
          NODE_PATH="$RUNNER_TEMP/visual/node_modules" node scripts/dependency-regression.cjs
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-regression-evidence
          path: |
            regression-evidence/
            ${{ runner.temp }}/baseline-build.log
            ${{ runner.temp }}/candidate-build.log
