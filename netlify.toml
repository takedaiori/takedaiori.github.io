[build]
  command = "node scripts/maintenance/verify-server-env.cjs && yarn run build && node scripts/maintenance/audit-server-output.cjs"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Server deployment hardening; GitHub Pages does not apply Netlify headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
